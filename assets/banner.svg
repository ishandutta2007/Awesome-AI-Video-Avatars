<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b1e" />
      <stop offset="50%" stop-color="#120e2e" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 48px;
      fill: #ffffff;
      letter-spacing: -1px;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #cbd5e1;
      letter-spacing: 0.5px;
    }
    .tag-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e0e7ff;
    }

    /* Ambient animated elements */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.08); }
    }
    @keyframes floatOrb1 {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(30px, -20px); }
    }
    @keyframes floatOrb2 {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(-25px, 25px); }
    }
    @keyframes waveMotion {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -120; }
    }
    @keyframes audioPulse1 {
      0%, 100% { height: 16px; y: 252px; }
      50% { height: 42px; y: 226px; }
    }
    @keyframes audioPulse2 {
      0%, 100% { height: 38px; y: 230px; }
      50% { height: 18px; y: 250px; }
    }
    @keyframes audioPulse3 {
      0%, 100% { height: 26px; y: 242px; }
      50% { height: 50px; y: 218px; }
    }

    .orb-1 {
      animation: floatOrb1 9s ease-in-out infinite, pulseGlow 6s ease-in-out infinite;
      transform-origin: 150px 100px;
    }
    .orb-2 {
      animation: floatOrb2 11s ease-in-out infinite, pulseGlow 7s ease-in-out infinite;
      transform-origin: 1050px 250px;
    }
    .wave-line {
      stroke-dasharray: 8 12;
      animation: waveMotion 12s linear infinite;
    }
    .bar-1 { animation: audioPulse1 1.2s ease-in-out infinite; }
    .bar-2 { animation: audioPulse2 1.0s ease-in-out infinite 0.2s; }
    .bar-3 { animation: audioPulse3 1.4s ease-in-out infinite 0.4s; }
    .bar-4 { animation: audioPulse1 0.9s ease-in-out infinite 0.3s; }
    .bar-5 { animation: audioPulse2 1.3s ease-in-out infinite 0.1s; }
    .bar-6 { animation: audioPulse3 1.1s ease-in-out infinite 0.5s; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />

  <!-- Background Grid Pattern -->
  <g opacity="0.12" stroke="#6366f1" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="120" y1="0" x2="120" y2="360" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="360" y1="0" x2="360" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="720" y1="0" x2="720" y2="360" />
    <line x1="840" y1="0" x2="840" y2="360" />
    <line x1="960" y1="0" x2="960" y2="360" />
    <line x1="1080" y1="0" x2="1080" y2="360" />
  </g>

  <!-- Ambient Dynamic Animated Orbs in Background -->
  <circle class="orb-1" cx="160" cy="90" r="140" fill="#6366f1" opacity="0.3" filter="url(#glow)" />
  <circle class="orb-2" cx="1040" cy="260" r="160" fill="#ec4899" opacity="0.25" filter="url(#glow)" />
  <circle cx="620" cy="40" r="100" fill="#06b6d4" opacity="0.2" filter="url(#glow)" />

  <!-- Animated Streamlines in Background (behind text) -->
  <path class="wave-line" d="M 0 110 Q 300 170 600 110 T 1200 110" fill="none" stroke="url(#primary-grad)" stroke-width="2.5" opacity="0.4" />
  <path class="wave-line" d="M 0 250 Q 300 190 600 250 T 1200 250" fill="none" stroke="#06b6d4" stroke-width="1.8" opacity="0.3" />

  <!-- Subtle Side Decorative Graphic: Audio Visualizer Waves (Right Bottom) -->
  <g opacity="0.6">
    <rect class="bar-1" x="1080" y="240" width="6" height="28" rx="3" fill="#a855f7" />
    <rect class="bar-2" x="1092" y="235" width="6" height="38" rx="3" fill="#ec4899" />
    <rect class="bar-3" x="1104" y="242" width="6" height="24" rx="3" fill="#6366f1" />
    <rect class="bar-4" x="1116" y="230" width="6" height="48" rx="3" fill="#06b6d4" />
    <rect class="bar-5" x="1128" y="245" width="6" height="18" rx="3" fill="#a855f7" />
    <rect class="bar-6" x="1140" y="238" width="6" height="32" rx="3" fill="#ec4899" />
  </g>

  <!-- Foreground Content: Header Badge -->
  <g transform="translate(80, 52)">
    <rect width="210" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
    <circle cx="16" cy="16" r="5" fill="#22c55e" />
    <text x="30" y="21" class="tag-text">CURATED ECOSYSTEM 2026</text>
  </g>

  <!-- Foreground Title -->
  <text x="80" y="145" class="title-text">
    Awesome <tspan fill="url(#primary-grad)">AI Video Avatars</tspan>
  </text>

  <!-- Foreground Subtitle -->
  <text x="80" y="195" class="subtitle-text">
    Talking-Head Synthesis • Real-Time Face Swap • VTuber Automation • Digital Humans
  </text>

  <!-- Foreground Feature Pills -->
  <g transform="translate(80, 245)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="38" rx="10" fill="#18182b" stroke="#3730a3" stroke-width="1.2" filter="url(#card-shadow)"/>
      <text x="18" y="24" class="tag-text">🎙️ Talking-Head Tech</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(196, 0)">
      <rect width="185" height="38" rx="10" fill="#18182b" stroke="#3730a3" stroke-width="1.2" filter="url(#card-shadow)"/>
      <text x="18" y="24" class="tag-text">🎭 Real-Time Face Swap</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(397, 0)">
      <rect width="175" height="38" rx="10" fill="#18182b" stroke="#3730a3" stroke-width="1.2" filter="url(#card-shadow)"/>
      <text x="18" y="24" class="tag-text">⚡ VTuber Pipelines</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(588, 0)">
      <rect width="195" height="38" rx="10" fill="#18182b" stroke="#3730a3" stroke-width="1.2" filter="url(#card-shadow)"/>
      <text x="18" y="24" class="tag-text">🏢 SaaS &amp; Open-Source</text>
    </g>
  </g>
</svg>
